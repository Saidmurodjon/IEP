name = "energetika-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Media ombori. Bog'lanish yo'q bo'lsa yuklash endpointi 503 /
# STORAGE_UNAVAILABLE qaytaradi (fail closed), fayllar boshqa joyga yozilmaydi.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "energetika-media"

# Secrets (set via: wrangler secret put SECRET_NAME)
# DATABASE_URL
# JWT_SECRET
# FRONTEND_URL
# RESEND_API_KEY  — xat yuborish uchun. Yo'q bo'lsa murojaat baribir saqlanadi.
# MAIL_FROM       — jo'natuvchi manzil. Resend'da domen tasdiqlangach o'zgartiriladi,
#                   masalan "Energetika instituti <murojaat@iep.uz>".
