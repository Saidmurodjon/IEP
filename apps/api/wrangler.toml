name = "energetika-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"

# Media ombori. Bog'lanish yo'q bo'lsa yuklash endpointi 503 /
