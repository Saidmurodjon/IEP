<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Institut haqida" seksiyasi uchun placeholder — o'zimiz yasagan abstrakt grafika.
  Motiv: energiya samaradorligi / muqobil manbalar (turbina + panel + tarmoq).
  Haqiqiy rasm kelgach shu fayl almashtiriladi.
-->
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Institut faoliyati abstrakt tasviri">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6edf5"/>
      <stop offset="1" stop-color="#c7d8e8"/>
    </linearGradient>
    <linearGradient id="turbine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#325882"/>
      <stop offset="1" stop-color="#1a3a5f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="16" fill="url(#abg)"/>

  <!-- Quyosh -->
  <circle cx="620" cy="150" r="70" fill="#e8c476"/>
  <circle cx="620" cy="150" r="70" fill="none" stroke="#c8973f" stroke-width="3"/>
  <g stroke="#c8973f" stroke-width="4" stroke-linecap="round">
    <line x1="620" y1="45" x2="620" y2="20"/>
    <line x1="620" y1="255" x2="620" y2="280"/>
    <line x1="515" y1="150" x2="490" y2="150"/>
    <line x1="725" y1="150" x2="750" y2="150"/>
    <line x1="546" y1="76" x2="529" y2="59"/>
    <line x1="694" y1="76" x2="711" y2="59"/>
  </g>

  <!-- Shamol turbinasi -->
  <g>
    <rect x="232" y="220" width="16" height="280" rx="6" fill="url(#turbine)"/>
    <g transform="translate(240 220)" fill="#28466a">
      <path d="M0 0 L-14 -120 L14 -108 Z"/>
      <path d="M0 0 L118 -40 L104 -14 Z" transform="rotate(120)"/>
      <path d="M0 0 L118 -40 L104 -14 Z" transform="rotate(240)"/>
      <circle r="12" fill="#c8973f"/>
    </g>
  </g>

  <!-- Quyosh paneli -->
  <g transform="translate(430 380) rotate(-6)">
    <rect x="0" y="0" width="300" height="150" rx="6" fill="#325882"/>
    <g stroke="#6892b8" stroke-width="2">
      <line x1="75" y1="0" x2="75" y2="150"/><line x1="150" y1="0" x2="150" y2="150"/>
      <line x1="225" y1="0" x2="225" y2="150"/>
      <line x1="0" y1="50" x2="300" y2="50"/><line x1="0" y1="100" x2="300" y2="100"/>
    </g>
    <rect x="0" y="0" width="300" height="150" rx="6" fill="none" stroke="#1a3a5f" stroke-width="3"/>
  </g>

  <!-- Tarmoq chizig'i -->
  <g stroke="#43719c" stroke-width="2.5" opacity="0.7" fill="none">
    <path d="M60 520 L200 520 L240 500"/>
    <path d="M110 560 L110 300"/>
  </g>
  <g fill="#1a3a5f">
    <circle cx="60" cy="520" r="6"/><circle cx="110" cy="300" r="6"/>
  </g>
</svg>
