<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vaqtinchalik hero placeholder — o'zimiz yasagan abstrakt grafika.
  Motiv: elektr tarmog'i tugunlari + quyosh paneli panjarasi.
  Ranglar: primary (akademik navy) + accent (oltin). Haqiqiy foto emas.
  Institut haqiqiy rasm bergach, shu fayl o'sha rasm bilan almashtiriladi.
-->
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Energetika tarmog'i abstrakt tasviri">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12283f"/>
      <stop offset="0.55" stop-color="#1a3a5f"/>
      <stop offset="1" stop-color="#28466a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c476"/>
      <stop offset="0.6" stop-color="#c8973f"/>
      <stop offset="1" stop-color="#c8973f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="panel" width="86" height="56" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="80" height="50" rx="3" fill="#28466a" stroke="#43719c" stroke-width="1.5"/>
      <line x1="43" y1="3" x2="43" y2="53" stroke="#12283f" stroke-width="1.5"/>
      <line x1="3" y1="28" x2="83" y2="28" stroke="#12283f" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Quyosh (o'ng yuqori) -->
  <circle cx="1290" cy="230" r="230" fill="url(#sun)" opacity="0.55"/>
  <g stroke="#e8c476" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <line x1="1290" y1="20" x2="1290" y2="70"/>
    <line x1="1470" y1="120" x2="1435" y2="150"/>
    <line x1="1520" y1="230" x2="1470" y2="230"/>
    <line x1="1110" y1="120" x2="1145" y2="150"/>
  </g>

  <!-- Quyosh paneli maydoni (o'ng past) -->
  <g transform="rotate(-8 1230 640)" opacity="0.9">
    <rect x="980" y="470" width="516" height="336" fill="url(#panel)"/>
    <rect x="980" y="470" width="516" height="336" fill="none" stroke="#c8973f" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Elektr tarmog'i tugunlari va bog'lanishlari (butun kenglik) -->
  <g stroke="#43719c" stroke-width="1.6" opacity="0.55">
    <path d="M120 700 L300 560 L470 640 L640 470 L840 560 L1020 430"/>
    <path d="M120 520 L300 560 L300 720"/>
    <path d="M470 640 L470 800 L640 720"/>
    <path d="M640 470 L640 300 L840 220"/>
    <path d="M840 560 L1020 640 L1200 560"/>
  </g>
  <g fill="#9bb8d4">
    <circle cx="120" cy="700" r="6"/><circle cx="300" cy="560" r="7"/>
    <circle cx="470" cy="640" r="7"/><circle cx="640" cy="470" r="8"/>
    <circle cx="840" cy="560" r="7"/><circle cx="1020" cy="430" r="6"/>
    <circle cx="300" cy="720" r="5"/><circle cx="640" cy="300" r="5"/>
    <circle cx="840" cy="220" r="5"/><circle cx="1200" cy="560" r="6"/>
  </g>
  <g fill="#c8973f">
    <circle cx="640" cy="470" r="4"/><circle cx="300" cy="560" r="3.5"/>
    <circle cx="1020" cy="430" r="3.5"/><circle cx="840" cy="560" r="3.5"/>
  </g>
</svg>
